<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" preserveAspectRatio="none">
  <!-- 葉の影。光斑とは別のノイズで、暗い側だけを残す -->
  <filter id="f" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.018" numOctaves="3" seed="4"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.14  0 0 0 0 0.05  -1 0 0 0 1"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0 0 0 0 0.25 0.6 0.85 0.9 0.9"/>
    </feComponentTransfer>
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <rect width="1600" height="400" filter="url(#f)"/>
</svg>
