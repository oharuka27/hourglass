<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f5ef">
<title>砂で ひと息</title>
<link rel="preload" as="image" href="assets/quiet-corner.png" fetchpriority="high">
<link rel="preload" as="image" href="assets/sunset-painterly.png">
<link rel="preload" as="image" href="assets/night-painterly.png">
<link rel="preload" as="image" href="assets/seaside-painterly.png" media="(min-width: 601px)">
<link rel="preload" as="image" href="assets/forest-painterly.png" media="(min-width: 601px)">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="heading">
      <h1>砂で ひと息</h1>
      <p class="intro">ゆっくり、じぶんのペースで</p>
      <p class="heading-message">何もしない時間も たいせつな時間</p>
    </header>
    <section class="scene" aria-label="ディフューザーとリスのぬいぐるみを添えた砂時計">
      <div class="theme-buttons" aria-label="背景テーマ">
        <button class="theme-button" type="button" data-theme-button="room">部屋</button>
        <button class="theme-button" type="button" data-theme-button="sunset">夕焼け</button>
        <button class="theme-button" type="button" data-theme-button="seaside">海辺</button>
        <button class="theme-button" type="button" data-theme-button="forest">森</button>
        <button class="theme-button" type="button" data-theme-button="night">夜空</button>
      </div>
      <div class="night-layer" aria-hidden="true">
        <div class="shooting-star star-a"></div>
        <div class="shooting-star star-b"></div>
        <div class="shooting-star star-c"></div>
      </div>
      <div class="forest-layer" aria-hidden="true">
        <div class="dapple dapple-shadow"></div>
        <div class="dapple dapple-light"></div>
      </div>
      <img class="scene-art" src="assets/quiet-corner.png" alt="透明なボトルに黒いスティックを挿したアロマディフューザーと、大きな茶色のしっぽのリスのぬいぐるみ" width="1536" height="1024">
      <button class="hourglass" id="hourglassBtn" aria-label="砂時計の上下を入れ替える" aria-describedby="flipHint">
        <canvas id="canvas" width="520" height="760">砂時計をひっくり返す</canvas>
      </button>
    </section>
    <p class="flip-hint" id="flipHint"><span class="hint-line desktop-pointer-hint"><span class="hint-icon" aria-hidden="true">↔</span>砂時計の内をタップすると、砂がよけます</span> <span class="hint-line"><span class="hint-icon" aria-hidden="true">↻</span>砂時計の外をタップすると、時計がひっくり返ります</span></p>
    <span id="flipStatus" class="sr-only" role="status"></span>
    <section class="controls" aria-label="砂時計の設定">
      <div class="control-row size-control" role="group" aria-labelledby="particleSizeLabel">
        <span id="particleSizeLabel">粒のサイズ</span>
        <div class="size-buttons">
          <button type="button" data-size="normal" aria-pressed="true">ふつう</button>
          <button type="button" data-size="fine" aria-pressed="false">細かい</button>
        </div>
      </div>
      <label class="control-row" for="particleCount">
        <span>砂のつぶ</span>
        <input type="range" id="particleCount" min="300" max="1000" step="50" value="500">
        <span id="particleCountValue">500</span>
      </label>
      <label class="control-row" for="neckWidth">
        <span>くびれの幅</span>
        <input type="range" id="neckWidth" min="12" max="80" step="2" value="28">
        <span id="neckWidthValue">28</span>
      </label>
      <div class="buttons">
        <button id="resetBtn">もういちど <span aria-hidden="true">↺</span></button>
        <button id="flipBtn">ひっくり返す <span aria-hidden="true">↻</span></button>
      </div>
      <p class="settings-note">つぶの数は「もういちど」で反映されます</p>
      <details class="diagnostics">
        <summary>シミュレーション情報</summary>
        <div class="stats"><span id="fps">FPS: --</span><span id="particleActual">配置粒子数: --</span></div>
      </details>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
